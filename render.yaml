services:
  - type: web
    name: taller-pixabay
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_URI_MIRROR
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
